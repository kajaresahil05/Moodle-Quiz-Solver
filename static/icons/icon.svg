<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#141c30"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4"/>
  <!-- Glowing icon elements -->
  <g filter="url(#glow)" transform="translate(106, 106) scale(12.5)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top Cap Layer -->
    <path d="M12 2L2 7l10 5 10-5-10-5z" stroke="url(#blueGrad)" stroke-width="2" fill="rgba(79, 158, 248, 0.2)"/>
    <!-- Middle Layer -->
    <path d="M2 12l10 5 10-5" stroke="url(#purpleGrad)" stroke-width="2"/>
    <!-- Bottom Layer -->
    <path d="M2 17l10 5 10-5" stroke="#38bdf8" stroke-width="2"/>
  </g>
</svg>
