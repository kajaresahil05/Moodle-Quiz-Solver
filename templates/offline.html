<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — Moodle Quiz Assistant</title>
    <meta name="theme-color" content="#0a0e1a">
    <link rel="stylesheet" href="/static/css/main.css?v=2.2">
    <style>
        .offline-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at 50% 20%, #151d33 0%, #0a0e1a 70%);
            color: #e2e8f0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            text-align: center;
        }
        .offline-card {
            background: rgba(19, 25, 41, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(12px);
        }
        .offline-icon {
            width: 72px;
            height: 72px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: rgba(252, 129, 129, 0.12);
            color: #fc8181;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .offline-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .offline-desc {
            color: #8892a4;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 28px;
        }
        .offline-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
    </style>
</head>
<body class="offline-wrapper">
    <div class="offline-card">
        <div class="offline-icon">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="1" y1="1" x2="23" y2="23"/>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
                <path d="M10.71 5.05A16 16 0 0 1 22.58 9"/>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
                <line x1="12" y1="20" x2="12.01" y2="20"/>
            </svg>
        </div>
        <h1 class="offline-title">You're Offline</h1>
        <p class="offline-desc">QuizAssist needs an active network connection to communicate with the local server and Moodle.</p>
        <div class="offline-actions">
            <button onclick="window.location.reload()" class="btn btn-primary" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                Retry Connection
            </button>
        </div>
    </div>
</body>
</html>
